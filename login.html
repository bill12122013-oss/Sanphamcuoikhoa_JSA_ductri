<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Đăng nhập tài khoản - Shoes Zone">
  <title>Đăng Nhập | Shoes Zone</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="index.html">
        <i class="fa-solid fa-person-running text-danger"></i><i class="fa-solid fa-fire text-danger me-2"></i>Shoes Zone
      </a>
      <a class="btn btn-outline-dark btn-sm" href="index.html">
        <i class="fa-solid fa-arrow-left me-2"></i>Trang Chủ
      </a>
    </div>
  </nav>

  <!-- LOGIN SECTION -->
  <main class="flex-grow-1 d-flex align-items-center py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
          <div class="card border-0 shadow-sm p-4 rounded-4">
            <div class="text-center mb-4">
              <h3 class="fw-bold"><i class="fa-solid fa-lock text-danger me-2"></i>Đăng Nhập</h3>
              <p class="text-secondary small">Chào mừng bạn quay lại với Shoes Zone</p>
            </div>

            <p class="small text-secondary">Tài khoản demo trên trình duyệt; không dùng mật khẩu thật.</p><form id="loginForm">
              <div class="mb-3">
                <label class="form-label fw-semibold small">Email</label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="fa-solid fa-user text-muted"></i></span>
                  <input type="email" class="form-control" id="loginEmail" autocomplete="username" required placeholder="Nhập email của bạn">
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label fw-semibold small">Mật khẩu</label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="fa-solid fa-key text-muted"></i></span>
                  <input type="password" class="form-control" id="loginPassword" autocomplete="current-password" required placeholder="Nhập mật khẩu">
                </div>
              </div>

              <!-- TODO HS: Chỉ thêm ghi nhớ/quên mật khẩu khi có xử lý. -->
              <button type="submit" class="btn btn-danger w-100 fw-bold py-2 mb-3">Đăng Nhập</button>
            </form>
            <div class="text-center small">
              <span class="text-secondary">Chưa có tài khoản?</span>
              <a href="register.html" class="text-danger fw-semibold text-decoration-none">Đăng ký ngay</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="bg-dark text-white py-3 text-center">
    <div class="container">
      <p class="small mb-0 text-secondary">© 2026 Shoes Zone. All rights reserved.</p>
    </div>
  </footer>
    <script src="JS/login.js"></script>
</body>
</html>
