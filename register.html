<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Đăng ký tài khoản mới - Shoes Zone">
  <title>Đăng Ký | Shoes Zone</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="index.html">
        <i class="fa-solid fa-person-running text-danger"></i><i class="fa-solid fa-fire text-danger me-2"></i>Shoes Zone
      </a>
      <a class="btn btn-outline-dark btn-sm" href="login.html">
        <i class="fa-solid fa-arrow-left me-2"></i>Quay lại Đăng nhập
      </a>
    </div>
  </nav>

  <!-- REGISTER SECTION -->
  <main class="flex-grow-1 d-flex align-items-center py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="card border-0 shadow-sm p-4 rounded-4">
            <div class="text-center mb-4">
              <h3 class="fw-bold"><i class="fa-solid fa-user-plus text-danger me-2"></i>Đăng Ký Tài Khoản</h3>
              <p class="text-secondary small">Trở thành thành viên của Shoes Zone để nhận nhiều ưu đãi</p>
            </div>

            <form id="registerForm">
              <div class="mb-3">
                <label class="form-label fw-semibold small">Họ và tên</label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="fa-solid fa-user text-muted"></i></span>
                  <input type="text" class="form-control" id="regName" required placeholder="Nhập họ và tên đầy đủ">
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label fw-semibold small">Email</label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="fa-solid fa-envelope text-muted"></i></span>
                  <input type="email" class="form-control" id="regEmail" required placeholder="Nhập địa chỉ email của bạn">
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label fw-semibold small">Mật khẩu</label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="fa-solid fa-key text-muted"></i></span>
                  <input type="password" class="form-control" id="regPassword" required placeholder="Tạo mật khẩu (tối thiểu 6 ký tự)">
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label fw-semibold small">Nhập lại mật khẩu</label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="fa-solid fa-check-double text-muted"></i></span>
                  <input type="password" class="form-control" id="regConfirmPassword" required placeholder="Xác nhận lại mật khẩu">
                </div>
              </div>

              <div class="form-check mb-4 small">
                <input class="form-check-input" type="checkbox" id="termsCheck" required>
                <label class="form-check-label text-secondary" for="termsCheck">
                  Tôi đồng ý với các <a href="#" class="text-danger text-decoration-none">Điều khoản dịch vụ</a>
                </label>
              </div>

              <button type="submit" class="btn btn-danger w-100 fw-bold py-2 mb-3">Đăng Ký</button>
            </form>

            <div class="text-center small">
              <span class="text-secondary">Đã có tài khoản?</span> 
              <a href="login.html" class="text-danger fw-semibold text-decoration-none">Đăng nhập ngay</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="bg-dark text-white py-3 text-center">
    <div class="container">
      <p class="small mb-0 text-secondary">© 2026 Shoes Zone. All rights reserved.</p>
    </div>
  </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="JS/register.js"></script>
</body>
</html>
